name: pull request

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run test:fmt

  test:
    name: test and build
    runs-on: ubuntu-latest
    needs: format
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run test:types
      - name: Lint
        run: npm run test:lint
      - name: Run unit tests
        run: npm run test:unit
      - name: Build package
        run: npm run build
      - name: Build demo
        run: npm run build:demo
